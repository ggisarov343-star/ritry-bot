<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri 30 видео</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
.header{display:flex;gap:8px;padding:10px;position:sticky;top:0;background:#0f0f0f;z-index:20;border-bottom:1px solid #222}
input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:12px 16px;border-radius:22px;outline:none}
button{border:none;border-radius:22px;padding:12px 18px;font-weight:bold;cursor:pointer}
#player{display:none;background:#000;position:sticky;top:60px;z-index:10}
#player iframe{width:100%;height:52vw;max-height:300px;border:none}
.bar{display:flex;gap:8px;padding:10px}
.count{text-align:center;color:#888;padding:10px;font-size:13px}
.item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1a1a1a}
.item:active{background:#1a1a1a}
.item img{width:150px;height:84px;border-radius:10px;object-fit:cover;background:#222;flex-shrink:0}
.title{font-size:14px;line-height:1.35}
.meta{font-size:12px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="header">
<input id="q" type="text" placeholder="Напиши что искать, например: Ману бегир">
<button onclick="search()" style="background:#fff;color:#000">🔍</button>
</div>
<div id="player">
<iframe id="frm" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div class="bar">
<button onclick="document.getElementById('list').scrollIntoView()" style="flex:1;background:#222;color:#fff">▼ Список 30</button>
<button onclick="download()" style="flex:2;background:#3ea6ff;color:#000">⬇ Скачать в боте</button>
</div>
</div>
<div class="count" id="count">Напиши что искать - покажу 30 видео, можно смотреть прямо тут</div>
<div id="list"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
let curId=null;

const INSTANCES = [
  'https://vid.puffyan.us',
  'https://inv.nadeko.net',
  'https://invidious.flokinet.to',
  'https://yewtu.be',
  'https://inv.riverside.rocks',
  'https://invidious.nerdvpn.de',
  'https://inv.tux.pizza',
  'https://iv.melmac.space'
];

async function search(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('count').innerText='Ищу "'+q+'" ... пробую 8 серверов...';
  document.getElementById('list').innerHTML='';
  
  for(let base of INSTANCES){
    try{
      const url = `${base}/api/v1/search?q=${encodeURIComponent(q)}`;
      const r = await fetch(url, {signal: AbortSignal.timeout(5000)});
      if(!r.ok) continue;
      const data = await r.json();
      if(!data || !data.length) continue;
      
      // Фильтруем только видео
      const videos = data.filter(v=>v.type==='video').slice(0,30);
      if(videos.length===0) continue;
      
      document.getElementById('count').innerText=`Нашел ${videos.length} видео (сервер ${base}) - нажми чтобы смотреть`;
      const list=document.getElementById('list');
      list.innerHTML='';
      videos.forEach((v,i)=>{
        const div=document.createElement('div');
        div.className='item';
        const thumb = v.videoThumbnails ? v.videoThumbnails[2].url : `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`;
        div.innerHTML=`<img src="${thumb}"><div><div class="title">${i+1}. ${v.title}</div><div class="meta">${v.author} • ${v.viewCountText||''}</div></div>`;
        div.onclick=()=>play(v.videoId);
        list.appendChild(div);
      });
      if(videos[0]) play(videos[0].videoId);
      return; // успех - выходим
    }catch(e){ console.log('fail', base, e); }
  }
  
  // Если все серверы не сработали - fallback через прокси
  document.getElementById('count').innerText='Все серверы заняты, пробую через прокси...';
  try{
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent('https://www.youtube.com/results?search_query='+encodeURIComponent(q))}`;
    const r = await fetch(proxyUrl);
    const j = await r.json();
    const html = j.contents;
    const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/g;
    const ids=[]; let m;
    while((m=regex.exec(html))!==null && ids.length<30){ if(!ids.includes(m[1])) ids.push(m[1]); }
    if(ids.length){
      document.getElementById('count').innerText=`Нашел ${ids.length} видео через прокси`;
      const list=document.getElementById('list');
      ids.forEach((id,i)=>{
        const div=document.createElement('div');
        div.className='item';
        div.innerHTML=`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg"><div><div class="title">${i+1}. Видео ${id}</div><div class="meta">YouTube</div></div>`;
        div.onclick=()=>play(id);
        list.appendChild(div);
      });
      play(ids[0]);
      return;
    }
  }catch(e){}
  
  document.getElementById('count').innerText='Не получилось. Включи VPN на 10 секунд и попробуй снова - это блокировка в TJ';
}

function play(id){
  curId=id;
  document.getElementById('player').style.display='block';
  document.getElementById('frm').src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1';
  window.scrollTo({top:0,behavior:'smooth'});
}
function download(){
  if(!curId) return;
  tg.sendData('https://www.youtube.com/watch?v='+curId);
  tg.showPopup({message:'Отправил боту! Видео придет в чат'});
}
document.getElementById('q').addEventListener('keypress',e=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
