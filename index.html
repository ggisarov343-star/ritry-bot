<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri YouTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial;padding:15px}
h2{text-align:center;font-size:16px;margin:10px 0}
.search{display:flex;gap:8px;margin:15px 0}
input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:14px 18px;border-radius:25px;outline:none;font-size:16px}
button{background:#fff;color:#000;border:none;padding:14px 22px;border-radius:25px;font-weight:bold;cursor:pointer}
.tip{color:#888;text-align:center;font-size:13px;margin-top:20px;line-height:1.4}
.hist{margin-top:20px}
.hist div{background:#1a1a1a;padding:12px 16px;border-radius:12px;margin-bottom:8px;cursor:pointer;border:1px solid #222}
.hist div:active{background:#222}
</style>
</head>
<body>
<h2>Ritri_YouTube - Поиск</h2>
<div class="search">
<input id="q" type="text" placeholder="Напиши что искать, например: Ману бегир" autofocus>
<button onclick="go()">🔍</button>
</div>
<div class="tip">
Напиши любое название песни и нажми поиск.<br>
Результаты появятся в чате бота - там можно выбрать из 5 видео и сразу смотреть.
</div>
<div class="hist" id="hist"></div>

<script>
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

// История поиска
let history = JSON.parse(localStorage.getItem('hist')||'[]');
function renderHist(){
  const h=document.getElementById('hist');
  h.innerHTML='';
  history.slice(0,8).forEach(t=>{
    const d=document.createElement('div');
    d.innerText='🕘 '+t;
    d.onclick=()=>{ document.getElementById('q').value=t; go(); };
    h.appendChild(d);
  });
}
renderHist();

function go(){
  const q=document.getElementById('q').value.trim();
  if(!q){ tg.showAlert('Напиши что искать'); return; }
  
  // Сохраняем в историю
  if(!history.includes(q)){ history.unshift(q); history=history.slice(0,10); localStorage.setItem('hist', JSON.stringify(history)); }
  
  // Отправляем боту - бот сделает поиск через yt-dlp (у него нет блокировки)
  tg.sendData(q);
  
  // Показываем что отправили
  document.querySelector('.tip').innerHTML = `✅ Отправил "<b>${q}</b>" боту...<br>Сейчас в чате появятся 5 видео, выбери любое`;
  
  setTimeout(()=>{ tg.close(); }, 800);
}

document.getElementById('q').addEventListener('keypress', e=>{
  if(e.key==='Enter') go();
});
</script>
</body>
</html>
