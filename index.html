<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial}
.top{position:sticky;top:0;background:#0f0f0f;padding:10px;display:flex;gap:8px;z-index:10;border-bottom:1px solid #222}
.top input{flex:1;background:#212121;border:none;border-radius:20px;padding:12px 16px;color:#fff;outline:none}
.top button{background:#fff;color:#000;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold}
.v{display:flex;gap:10px;padding:12px;border-bottom:1px solid #1a1a1a}
.v img{width:150px;height:85px;border-radius:8px;background:#222;object-fit:cover}
.v .t{font-size:14px}
.v .c{font-size:12px;color:#aaa}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;overflow-y:auto}
#player iframe{width:100%;aspect-ratio:16/9;border:none;background:#000}
.btn{display:block;margin:10px 12px 0;background:#222;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:bold;width:calc(100% - 24px);text-align:center;text-decoration:none}
.btn.green{background:#00e676;color:#000}
.close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.8);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;z-index:101}
#status{text-align:center;color:#888;padding:15px;font-size:13px;white-space:pre-line}
</style>
</head>
<body>
<div class="top"><input id="q" placeholder="Марина, Фильмы..."><button onclick="search()">🔍</button></div>
<div id="status">Напиши что искать</div>
<div id="list"></div>
<div id="player">
<button class="close" onclick="closePlayer()">✕</button>
<iframe id="frm" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div style="padding:12px">
<div id="p-title" style="font-weight:bold"></div>
<div id="p-chan" style="color:#aaa;font-size:12px"></div>
<div id="dls"></div>
<button class="btn" onclick="closePlayer()">◀ Назад</button>
</div>
</div>
<script>
const tg=window.Telegram.WebApp;try{tg.expand();tg.ready();}catch(e){}
let curBase='https://yewtu.be';

const PROXIES=['https://corsproxy.io/?','https://api.allorigins.win/raw?url=','https://api.codetabs.com/v1/proxy?quest='];
const PIPED=['https://pipedapi.kavin.rocks','https://api.piped.private.coffee','https://pipedapi.adminforge.de','https://pipedapi.leptos.newpipe.dev'];
const INVID=['https://yewtu.be','https://vid.puffyan.us','https://invidious.flokinet.to'];

async function fetchTry(url){
  for(let p of PROXIES){
    try{
      const r=await fetch(p+encodeURIComponent(url),{signal:AbortSignal.timeout(7000)});
      if(r.ok){ const t=await r.text(); if(t.length>100) return JSON.parse(t); }
    }catch(e){}
  }
  try{
    const r=await fetch(url,{signal:AbortSignal.timeout(7000)});
    if(r.ok) return await r.json();
  }catch(e){}
  throw 0;
}

async function search(){
  const q=document.getElementById('q').value.trim(); if(!q) return;
  document.getElementById('status').innerText='Ищу (обхожу блокировку TJ)...';
  document.getElementById('list').innerHTML='';
  
  for(let base of PIPED){
    try{
      const j=await fetchTry(base+'/search?q='+encodeURIComponent(q));
      const items=(j.items||j).filter(i=>i.url && i.url.includes('/watch'));
      if(!items.length) continue;
      const vids=items.slice(0,30).map(i=>{
        let id=''; try{id=new URL('https://a.com'+i.url).searchParams.get('v')}catch(e){id=i.url.split('v=')[1]}
        return {videoId:id,title:i.title,author:i.uploaderName,thumb:i.thumbnail||i.thumbnails?.[0]||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,views:i.views||''}
      }).filter(v=>v.videoId);
      if(vids.length){show(vids); return;}
    }catch(e){}
  }
  for(let base of INVID){
    try{
      const j=await fetchTry(base+'/api/v1/search?q='+encodeURIComponent(q));
      const vids=j.filter(x=>x.type==='video').slice(0,30);
      if(!vids.length) continue;
      curBase=base;
      show(vids.map(v=>({videoId:v.videoId,title:v.title,author:v.author,thumb:v.videoThumbnails?.[1]?.url||`https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`,views:v.viewCountText||''})));
      return;
    }catch(e){}
  }
  document.getElementById('status').innerText='Всё ещё блокируют 😔\nНажми ПОИСК еще 2 раза подряд - на 2-й раз прокси срабатывает\nИли включи VPN на 5 сек, выключи, и ищи снова - потом будет работать без VPN';
}

function show(vids){
  document.getElementById('status').innerText='Нашел '+vids.length;
  const list=document.getElementById('list'); list.innerHTML='';
  vids.forEach((v,i)=>{
    let thumb=v.thumb; if(thumb && thumb.startsWith('/')) thumb=curBase+thumb;
    const d=document.createElement('div'); d.className='v';
    d.innerHTML=`<img src="${thumb}" onerror="this.src='https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg'"><div><div class="t">${i+1}. ${v.title}</div><div class="c">${v.author} • ${v.views}</div></div>`;
    d.onclick=()=>openPlayer(v.videoId,v.title,v.author);
    list.appendChild(d);
  });
}

function openPlayer(id,title,author){
  document.getElementById('player').style.display='flex';
  document.getElementById('p-title').innerText=title;
  document.getElementById('p-chan').innerText=author;
  document.getElementById('frm').src=curBase+'/embed/'+id+'?autoplay=1';
  document.getElementById('dls').innerHTML=`
    <a class="btn green" href="${curBase}/latest_version?id=${id}&itag=22" target="_blank">⬇ Скачать 720p во 2-м окне</a>
    <a class="btn green" href="${curBase}/latest_version?id=${id}&itag=18" target="_blank">⬇ Скачать 360p во 2-м окне</a>
    <a class="btn" href="${curBase}/latest_version?id=${id}&itag=140" target="_blank" style="background:#3ea6ff">⬇ Скачать звук</a>
  `;
}
function closePlayer(){document.getElementById('player').style.display='none';document.getElementById('frm').src='about:blank';}
</script>
</body>
</html>
