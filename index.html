<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RITRY YouTube</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 18px;
            min-height: 100vh;
            background: #101820;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #ff3038;
            margin-top: 45px;
            font-size: 30px;
        }

        .section {
            margin-top: 35px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
        }

        button {
            width: 85%;
            padding: 17px;
            border: none;
            border-radius: 15px;
            background: #ff3038;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }

        .line {
            height: 1px;
            background: #39434c;
            margin: 35px 0;
        }

        .hint {
            color: #b8c1ca;
            font-size: 13px;
            margin-top: 12px;
        }

        #status {
            margin-top: 20px;
            color: #8de6a5;
        }
    </style>
</head>

<body>

    <h1>▶ RITRY YouTube</h1>

    <div class="section">

        <h2>🔍 Поиск видео и музыки</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Название видео или песни..."
        >

        <button onclick="searchContent()">
            🔍 Найти
        </button>

        <p class="hint">
            Введи название видео, исполнителя или песни
        </p>

    </div>

    <div class="line"></div>

    <div class="section">

        <h2>🎬 Поиск по ссылке</h2>

        <input
            type="url"
            id="urlInput"
            placeholder="https://youtube.com/watch?v=..."
        >

        <button onclick="openVideo()">
            ▶ Открыть видео
        </button>

    </div>

    <p id="status"></p>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        function searchContent() {
            const query = document
                .getElementById("searchInput")
                .value.trim();

            if (!query) {
                document.getElementById("status").innerText =
                    "Введите название видео или песни";
                return;
            }

            document.getElementById("status").innerText =
                "🔍 Выполняю поиск...";

            tg.sendData(query);
        }

        function openVideo() {
            const url = document
                .getElementById("urlInput")
                .value.trim();

            if (!url) {
                document.getElementById("status").innerText =
                    "Вставьте ссылку";
                return;
            }

            try {
                const parsed = new URL(url);

                const host = parsed.hostname.toLowerCase();

                const allowed =
                    host === "youtube.com" ||
                    host.endsWith(".youtube.com") ||
                    host === "youtu.be";

                if (parsed.protocol !== "https:" || !allowed) {
                    document.getElementById("status").innerText =
                        "Введите правильную ссылку YouTube";
                    return;
                }

                tg.sendData(url);

            } catch (e) {
                document.getElementById("status").innerText =
                    "Неправильная ссылка";
            }
        }
    </script>

</body>
</html>
