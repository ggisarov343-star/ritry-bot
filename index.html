<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
 body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif}
 .top{padding:14px;background:#212121;font-weight:700;font-size:18px}
 .search{margin:12px;background:#212121;border-radius:10px;padding:12px;display:flex}
 .search input{width:100%;background:transparent;border:0;color:#fff;outline:none;font-size:16px}
 .item{padding:14px 16px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top">Скачать видео и...</div>
<div class="search">‹ <input id="q" placeholder="Поиск на YouTube" style="margin-left:10px"></div>
<div class="item" onclick="go('бемире ин дилам')"><span>🕓 бемире ин дилам</span><span>↗</span></div>
<div class="item" onclick="go('барои ман гиря накун')"><span>🕓 барои ман гиря накун</span><span>↗</span></div>
<script>
Telegram.WebApp.ready();Telegram.WebApp.expand();
function go(t){Telegram.WebApp.sendData(t);Telegram.WebApp.close();}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go(e.target.value)});
</script>
</body>
</html>
