<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri YouTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
.header{position:sticky;top:0;background:#0f0f0f;padding:10px;display:flex;gap:8px;z-index:20;border-bottom:1px solid #222}
.header input{flex:1;background:#121212;border:1px solid #303030;color:#fff;padding:12px 16px;border-radius:20px;outline:none;font-size:15px}
.header button{background:#fff;color:#000;border:none;width:44px;height:44px;border-radius:50%;font-weight:bold;cursor:pointer}
#player{display:none;background:#000;position:sticky;top:60px;z-index:10}
#player iframe{width:100%;height:220px;border:none}
#player .bar{display:flex;gap:8px;padding:10px;background:#0f0f0f}
.bar button{flex:1;padding:12px;border-radius:20px;border:none;font-weight:bold}
.b1{background:#fff;color:#000}
.b2{background:#3ea6ff;color:#000}
#status{text-align:center;color:#aaa;padding:20px}
.video{display:flex;gap:10px;padding:10px;border-bottom:1px solid #1a1a1a}
.video:active{background:#1a1a1a}
.video img{width:150px;height:84px;border-radius:10px;object-fit:cover;background:#222}
.title{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="header">
<input id="q" type="text" placeholder="Ману бегир" />
<button onclick="search()">🔍</button>
</div>
<div id="player">
<iframe id="frm" allow="autoplay; encrypted-media" allowfullscreen></iframe>
<div class="bar">
<button class="b1" onclick="document.getElementById('list').scrollIntoView()">Список</button>
<button class="b2" id="downBtn">⬇ Скачать в боте</button>
</div>
</div>
<div id="status">Напиши и нажми поиск</div>
<div id="list"></div>
<script>
const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
let curId=null;

async function search(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('status').innerText='Ищу... Ману бегир...';
  document.getElementById('list').innerHTML='';
  
  try{
    // Ищем напрямую через YouTube через прокси который работает в TJ
    const ytUrl = 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
    const proxy = 'https://api.allorigins.win/get?url='+encodeURIComponent(ytUrl);
    const res = await fetch(proxy);
    const json = await res.json();
    const html = json.contents;
    
    // Парсим videoId и title из HTML ютуба
    const regex = /"videoId":"([^"]+)",".*?"title":{"runs":\[{"text":"([^"]+)/g;
    const videos=[];
    let m;
    while((m=regex.exec(html))!==null && videos.length<30){
      if(m[1].length===11) videos.push({id:m[1], title:m[2]});
    }
    // Убираем дубли
    const uniq=[];
    const seen=new Set();
    videos.forEach(v=>{ if(!seen.has(v.id)){ seen.add(v.id); uniq.push(v); } });
    
    if(uniq.length===0) throw new Error('no videos');
    
    document.getElementById('status').innerText=`Нашел ${uniq.length} видео - нажми чтобы смотреть`;
    const list=document.getElementById('list');
    uniq.forEach(v=>{
      const div=document.createElement('div');
      div.className='video';
      div.innerHTML=`<img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg"><div><div class="title">${v.title}</div><div class="meta">YouTube • ${v.id}</div></div>`;
      div.onclick=()=>play(v.id);
      list.appendChild(div);
    });
    
  }catch(e){
    console.log(e);
    document.getElementById('status').innerText='Ютуб не отвечает. Попробуй другое слово или включи VPN на 5 сек';
  }
}

function play(id){
  curId=id;
  document.getElementById('player').style.display='block';
  document.getElementById('frm').src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1`;
  window.scrollTo({top:0, behavior:'smooth'});
}

document.getElementById('downBtn').onclick=()=>{
  if(!curId) return;
  const url=`https://www.youtube.com/watch?v=${curId}`;
  tg.sendData(url);
  tg.showAlert('Отправил боту! Видео придет в чат');
};
document.getElementById('q').addEventListener('keypress', e=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
