<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Roboto,Arial}
.top{position:sticky;top:0;background:#0f0f0f;padding:10px;display:flex;gap:8px;z-index:10;border-bottom:1px solid #222}
.top input{flex:1;background:#212121;border:none;border-radius:20px;padding:12px 16px;color:white;outline:none;font-size:15px}
.top button{background:#fff;color:#000;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold;cursor:pointer}
.v{display:flex;gap:10px;padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.v:active{background:#1a1a1a}
.v img{width:150px;height:85px;border-radius:8px;object-fit:cover;background:#222;flex-shrink:0}
.v .t{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .c{font-size:12px;color:#aaa;margin-top:4px}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
#player iframe{width:100%;height:52vw;max-height:320px;border:none;background:#000}
#player .p-info{padding:12px;flex:1;overflow:auto}
#player .p-title{font-size:16px;line-height:1.3}
#player .p-chan{font-size:13px;color:#aaa;margin-top:6px}
#player .btn{margin:12px;background:#3ea6ff;color:white;border:none;border-radius:20px;padding:14px;font-weight:bold;cursor:pointer;width:calc(100% - 24px)}
#player .close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;z-index:101}
#status{text-align:center;color:#888;padding:15px;font-size:13px}
</style>
</head>
<body>
<div class="top">
<input id="q" type="text" placeholder="Напиши что искать, например: Ману бегир" value="">
<button onclick="search()">🔍</button>
</div>

<div id="status">Напиши название песни - покажу 30 видео, можно смотреть прямо тут</div>
<div id="list"></div>

<div id="player">
<button class="close" onclick="closePlayer()">✕</button>
<iframe id="frm" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div class="p-info">
<div class="p-title" id="p-title"></div>
<div class="p-chan" id="p-chan"></div>
<button class="btn" onclick="download()">⬇ Скачать это видео в боте</button>
<button class="btn" onclick="closePlayer()" style="background:#222">◀ Назад к списку 30 видео</button>
</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();
let curId=null;
let curTitle='';

const SERVERS = [
  'https://vid.puffyan.us',
  'https://inv.nadeko.net',
  'https://invidious.flokinet.to',
  'https://yewtu.be',
  'https://inv.riverside.rocks',
  'https://invidious.nerdvpn.de',
  'https://inv.tux.pizza'
];

async function search(){
  const q = document.getElementById('q').value.trim();
  if(!q){ tg.showAlert('Напиши что искать'); return; }
  
  document.getElementById('status').innerText = `Ищу "${q}" ... 30 видео...`;
  document.getElementById('list').innerHTML = '';
  
  for(let base of SERVERS){
    try{
      const r = await fetch(`${base}/api/v1/search?q=${encodeURIComponent(q)}`, {signal: AbortSignal.timeout(6000)});
      if(!r.ok) continue;
      const data = await r.json();
      const videos = data.filter(v=>v.type==='video').slice(0,30);
      if(videos.length===0) continue;
      
      document.getElementById('status').innerText = `Нашел ${videos.length} видео - нажми чтобы смотреть прямо тут`;
      const list = document.getElementById('list');
      list.innerHTML = '';
      videos.forEach((v,i)=>{
        const thumb = v.videoThumbnails ? (v.videoThumbnails[2]?.url || v.videoThumbnails[0].url) : `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`;
        const div = document.createElement('div');
        div.className='v';
        div.innerHTML=`<img src="${thumb}" loading="lazy"><div><div class="t">${i+1}. ${v.title}</div><div class="c">${v.author} • ${v.viewCountText||''}</div></div>`;
        div.onclick=()=>openPlayer(v.videoId, v.title, v.author);
        list.appendChild(div);
      });
      return;
    }catch(e){ console.log('fail', base); }
  }
  
  document.getElementById('status').innerText = 'Сервера не ответили. Включи VPN на 5 сек и попробуй снова - в TJ блокируют';
}

function openPlayer(id, title, chan){
  curId=id; curTitle=title;
  document.getElementById('frm').src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&modestbranding=1`;
  document.getElementById('p-title').innerText=title;
  document.getElementById('p-chan').innerText=chan||'';
  document.getElementById('player').style.display='flex';
}

function closePlayer(){
  document.getElementById('player').style.display='none';
  document.getElementById('frm').src='';
}

function download(){
  if(!curId) return;
  tg.sendData(`https://www.youtube.com/watch?v=${curId}`);
  tg.showPopup({message:`Отправил "${curTitle.slice(0,40)}..." боту! Видео придет в чат`});
}

document.getElementById('q').addEventListener('keypress', e=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
