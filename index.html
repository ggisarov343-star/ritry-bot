<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RITRY YouTube</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101820;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 15px;
}

h1 {
    color: #ff3038;
    font-size: 29px;
}

.search {
    display: flex;
    gap: 8px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    background: #ff3038;
    color: white;
    font-weight: bold;
}

#status {
    color: #b8c4ce;
    margin: 15px 3px;
}

.card {
    display: flex;
    gap: 10px;
    margin: 12px 0;
    padding: 10px;
    background: #1b2934;
    border-radius: 12px;
}

.thumb {
    width: 115px;
    height: 75px;
    object-fit: cover;
    border-radius: 8px;
}

.details {
    flex: 1;
    min-width: 0;
}

.title {
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 10px;
    overflow-wrap: anywhere;
}

.actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
}

.watch {
    background: #1677d2;
}

.open {
    background: #25834a;
}

#playerBox {
    display: none;
    margin: 15px 0;
}

iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    border-radius: 12px;
}

#playerTitle {
    font-weight: bold;
    margin: 10px 0;
}
</style>
</head>

<body>

<header>
    <h1>▶ RITRY YouTube</h1>
    <p>Поиск видео и музыки</p>
</header>

<div class="search">
    <input
        id="query"
        type="search"
        placeholder="Название песни или видео..."
    >

    <button onclick="searchVideos()">
        Найти
    </button>
</div>

<div id="status">
    Введи название видео или песни.
</div>

<div id="playerBox">
    <iframe
        id="player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>

    <div id="playerTitle"></div>
</div>

<div id="results"></div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

// ВСТАВЬ СЮДА СВОЙ YOUTUBE DATA API KEY
const API_KEY = "ВСТАВЬ_API_KEY";

async function searchVideos() {

    const query = document
        .getElementById("query")
        .value.trim();

    const status = document.getElementById("status");
    const results = document.getElementById("results");

    if (!query) {
        status.innerText = "Введи название видео или песни.";
        return;
    }

    if (API_KEY === "ВСТАВЬ_API_KEY") {
        status.innerText = "Сначала добавь YouTube API Key в код.";
        return;
    }

    results.innerHTML = "";
    status.innerText = "🔍 Ищу видео...";

    document.getElementById("playerBox").style.display = "none";
    document.getElementById("player").src = "";

    try {

        const url =
            "https://www.googleapis.com/youtube/v3/search" +
            "?part=snippet" +
            "&type=video" +
            "&maxResults=30" +
            "&q=" + encodeURIComponent(query) +
            "&key=" + API_KEY;

        const response = await fetch(url);

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "Ошибка YouTube API"
            );
        }

        const videos = data.items || [];

        if (videos.length === 0) {
            status.innerText = "Ничего не найдено.";
            return;
        }

        videos.forEach(video => {

            const id = video.id.videoId;
            const title = video.snippet.title;
            const image =
                video.snippet.thumbnails.medium?.url ||
                video.snippet.thumbnails.default?.url;

            const card = document.createElement("div");
            card.className = "card";

            const img = document.createElement("img");
            img.className = "thumb";
            img.src = image;
            img.alt = "";

            const details = document.createElement("div");
            details.className = "details";

            const titleElement = document.createElement("div");
            titleElement.className = "title";
            titleElement.textContent = title;

            const actions = document.createElement("div");
            actions.className = "actions";

            const watch = document.createElement("button");
            watch.className = "watch";
            watch.textContent = "▶ Смотреть";

            watch.onclick = () => playVideo(id, title);

            const open = document.createElement("button");
            open.className = "open";
            open.textContent = "YouTube";

            open.onclick = () => {
                window.open(
                    "https://www.youtube.com/watch?v=" + id,
                    "_blank"
                );
            };

            actions.append(watch, open);

            details.append(titleElement, actions);

            card.append(img, details);

            results.append(card);

        });

        status.innerText =
            "✅ Найдено видео: " + videos.length;

    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ Ошибка поиска: " + error.message;

    }
}


function playVideo(id, title) {

    const box = document.getElementById("playerBox");
    const player = document.getElementById("player");

    player.src =
        "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1";

    document.getElementById("playerTitle").innerText = title;

    box.style.display = "block";

    box.scrollIntoView({
        behavior: "smooth"
    });
}


document.getElementById("query").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") {
            searchVideos();
        }
    }
);

</script>

</body>
</html>
