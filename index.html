<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri YouTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:Arial}
.header{display:flex;gap:8px;padding:10px;background:#0f0f0f;position:sticky;top:0;z-index:10;border-bottom:1px solid #222}
input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:12px 16px;border-radius:20px;outline:none;font-size:15px}
button{background:#fff;color:#000;border:none;width:44px;height:44px;border-radius:50%;font-weight:bold;cursor:pointer}
#playerWrap{display:block;background:#000}
#playerWrap iframe{width:100%;height:55vw;max-height:320px;border:none;background:#000}
#bar{display:flex;gap:8px;padding:10px;background:#0f0f0f;border-bottom:1px solid #222}
#bar button{flex:1;padding:12px;border-radius:20px;border:none;font-weight:bold;cursor:pointer}
#b1{background:#222;color:#fff}
#b2{background:#3ea6ff;color:#000}
#hint{text-align:center;color:#aaa;padding:15px;font-size:13px}
</style>
</head>
<body>
<div class="header">
<input id="q" type="text" placeholder="Что искать? Например: Ману бегир" value="Ману бегир">
<button onclick="doSearch()">🔍</button>
</div>

<div id="playerWrap">
<iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
<div id="bar">
<button id="b1" onclick="document.getElementById('q').focus()">🔍 Новый поиск</button>
<button id="b2" onclick="download()">⬇ Скачать в боте</button>
</div>
</div>

<div id="hint">Напиши сверху любое название и нажми 🔍 - сразу можно смотреть прямо тут. Листай видео свайпом внутри плеера.</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();
let curQuery = 'Ману бегир';

function doSearch(){
  const q = document.getElementById('q').value.trim();
  if(!q) return;
  curQuery = q;
  // Главный трюк - встроенный поиск Ютуба прямо в iframe
  // listType=search показывает МНОГО видео и можно листать
  document.getElementById('yt').src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}&autoplay=1&modestbranding=1&rel=0`;
  document.getElementById('hint').innerHTML = `Смотришь: <b>${q}</b><br>Свайпай внутри плеера чтобы листать много видео. Нажми ⬇ чтобы скачать текущее в боте`;
}

function download(){
  // Берем текущее видео из плеера - отправляем запрос боту
  // Так как iframe не дает узнать что играет, отправляем поисковый запрос
  // Бот найдет первое видео по этому запросу и скачает
  tg.sendData(curQuery);
  tg.showPopup({message: `Отправляю "${curQuery}" боту на скачивание. Видео придет в чат!`});
}

document.getElementById('q').addEventListener('keypress', e=>{ if(e.key==='Enter') doSearch(); });

// Авто-запуск
doSearch();
</script>
</body>
</html>
