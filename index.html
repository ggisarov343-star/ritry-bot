<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri YouTube 30</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial}
.header{display:flex;gap:8px;padding:10px;position:sticky;top:0;background:#0f0f0f;z-index:20;border-bottom:1px solid #222}
input{flex:1;background:#1e1e1e;border:1px solid #333;color:#fff;padding:12px 16px;border-radius:22px;outline:none;font-size:15px}
button{border:none;border-radius:22px;padding:12px 18px;font-weight:bold;cursor:pointer}
#player{display:none;background:#000;position:sticky;top:58px;z-index:10}
#player iframe{width:100%;height:52vw;max-height:300px;border:none}
#player .bar{display:flex;gap:8px;padding:10px;background:#0f0f0f}
#count{text-align:center;color:#888;padding:10px;font-size:13px}
#list .item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer}
#list .item:active{background:#1a1a1a}
.item img{width:150px;height:84px;border-radius:10px;object-fit:cover;background:#222;flex-shrink:0}
.item .info{flex:1;min-width:0}
.title{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:#888;margin-top:5px}
</style>
</head>
<body>
<div class="header">
<input id="q" type="text" placeholder="Напиши что искать, например: Ману бегир">
<button onclick="doSearch()" style="background:#fff;color:#000">🔍</button>
</div>

<div id="player">
<iframe id="frm" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div class="bar">
<button onclick="document.getElementById('list').scrollIntoView({behavior:'smooth'})" style="flex:1;background:#222;color:#fff">▼ 30 видео</button>
<button onclick="download()" style="flex:2;background:#3ea6ff;color:#000">⬇ Скачать это в боте</button>
</div>
</div>

<div id="count">Напиши что искать - покажу 30 видео прямо тут, можно смотреть</div>
<div id="list"></div>

<script>
const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
let curId=null;
// !!! ЗАМЕНИ НА IP СВОЕГО СЕРВЕРА !!!
const API_URL = 'http://YOUR_SERVER_IP:8080/search';

async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q){ tg.showAlert('Напиши что искать'); return; }
  document.getElementById('count').innerText='Ищу "'+q+'" ... 30 видео...';
  document.getElementById('list').innerHTML='';
  document.getElementById('player').style.display='none';
  
  try{
    const r=await fetch(API_URL+'?q='+encodeURIComponent(q));
    const data=await r.json();
    if(!data.length){ document.getElementById('count').innerText='Ничего не нашел'; return; }
    
    document.getElementById('count').innerText=`Нашел ${data.length} видео - нажми чтобы смотреть прямо тут`;
    const list=document.getElementById('list');
    data.forEach((v,i)=>{
      const div=document.createElement('div');
      div.className='item';
      const mins = v.duration ? Math.floor(v.duration/60)+':'+String(Math.floor(v.duration%60)).padStart(2,'0') : '';
      div.innerHTML=`<img src="${v.thumb}" loading="lazy"><div class="info"><div class="title">${i+1}. ${v.title}</div><div class="meta">${v.author} ${mins ? '• '+mins : ''}</div></div>`;
      div.onclick=()=>play(v.id);
      list.appendChild(div);
    });
    // Авто-плей первого видео
    if(data[0]) play(data[0].id);
  }catch(e){
    document.getElementById('count').innerText='Ошибка: не могу связаться с сервером бота. Проверь что бот запущен и порт 8080 открыт. '+e;
  }
}

function play(id){
  curId=id;
  document.getElementById('player').style.display='block';
  document.getElementById('frm').src='https://www.youtube.com/embed/'+id+'?autoplay=1&playsinline=1&modestbranding=1';
  window.scrollTo({top:0,behavior:'smooth'});
}

function download(){
  if(!curId){ tg.showAlert('Сначала выбери видео'); return; }
  tg.sendData('https://www.youtube.com/watch?v='+curId);
  tg.showPopup({message:'Отправил боту! Видео придет в чат бота и скачается'});
}

document.getElementById('q').addEventListener('keypress',e=>{ if(e.key==='Enter') doSearch(); });
</script>
</body>
</html>
