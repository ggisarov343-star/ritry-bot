<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial}
.top{position:sticky;top:0;background:#0f0f0f;padding:10px;display:flex;gap:8px;z-index:10;border-bottom:1px solid #222}
.top input{flex:1;background:#212121;border:none;border-radius:20px;padding:12px 16px;color:white;outline:none;font-size:15px}
.top button{background:#fff;color:#000;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold;cursor:pointer}
.v{display:flex;gap:10px;padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.v:active{background:#1a1a1a}
.v img{width:150px;height:85px;border-radius:8px;object-fit:cover;background:#222;flex-shrink:0}
.v .t{font-size:14px;line-height:1.3}
.v .c{font-size:12px;color:#aaa;margin-top:4px}
#player{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:100;display:none;flex-direction:column}
#player iframe{width:100%;height:52vw;max-height:320px;border:none;background:#000}
#player .p-info{padding:12px}
#player .p-title{font-size:16px}
#player .p-chan{font-size:13px;color:#aaa;margin-top:6px}
#player .btn{margin:12px;background:#3ea6ff;color:white;border:none;border-radius:20px;padding:14px;font-weight:bold;width:calc(100% - 24px);cursor:pointer}
#player .close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;z-index:101}
#status{text-align:center;color:#888;padding:15px;font-size:13px;line-height:1.4}
</style>
</head>
<body>
<div class="top">
<input id="q" type="text" placeholder="Напиши что искать, например: Марина">
<button onclick="search()">🔍</button>
</div>
<div id="status">Напиши название - покажу 30 видео, можно смотреть прямо тут</div>
<div id="list"></div>

<div id="player">
<button class="close" onclick="closePlayer()">✕</button>
<iframe id="frm" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<div class="p-info">
<div class="p-title" id="p-title"></div>
<div class="p-chan" id="p-chan"></div>
<button class="btn" onclick="download()">⬇ Скачать это видео в боте</button>
<button class="btn" onclick="closePlayer()" style="background:#222">◀ Назад к 30 видео</button>
</div>
</div>

<script>
const tg = window.Telegram.WebApp; tg.expand(); tg.ready();
let curId=null, curTitle='';

// 8 серверов - пробуем все по очереди, пока один не ответит
const SERVERS = [
  'https://vid.puffyan.us',
  'https://inv.nadeko.net',
  'https://invidious.flokinet.to',
  'https://yewtu.be',
  'https://inv.riverside.rocks',
  'https://invidious.nerdvpn.de',
  'https://inv.tux.pizza',
  'https://iv.melmac.space'
];

async function search(){
  const q=document.getElementById('q').value.trim();
  if(!q){ tg.showAlert('Напиши что искать'); return; }
  
  document.getElementById('status').innerText=`Ищу "${q}" ... 30 видео...`;
  document.getElementById('list').innerHTML='';
  
  // Пробуем 8 серверов
  for(let base of SERVERS){
    try{
      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 5000);
      const res = await fetch(`${base}/api/v1/search?q=${encodeURIComponent(q)}`, {signal: controller.signal});
      clearTimeout(timeout);
      if(!res.ok) continue;
      const data = await res.json();
      const videos = data.filter(v=>v.type==='video').slice(0,30);
      if(videos.length===0) continue;
      
      // УСПЕХ - показываем 30 видео
      document.getElementById('status').innerText=`Нашел ${videos.length} видео - нажми чтобы смотреть прямо тут`;
      const list=document.getElementById('list');
      list.innerHTML='';
      videos.forEach((v,i)=>{
        const thumb = v.videoThumbnails ? (v.videoThumbnails[2]?.url || v.videoThumbnails[0].url) : `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`;
        const div=document.createElement('div');
        div.className='v';
        div.innerHTML=`<img src="${thumb}" loading="lazy"><div><div class="t">${i+1}. ${v.title}</div><div class="c">${v.author} • ${v.viewCountText||''}</div></div>`;
        div.onclick=()=>openPlayer(v.videoId, v.title, v.author);
        list.appendChild(div);
      });
      openPlayer(videos[0].videoId, videos[0].title, videos[0].author);
      return;
    }catch(e){ console.log('Сервер не ответил', base); }
  }
  
  // ЕСЛИ ВСЕ СЕРВЕРА ЗАБЛОКИРОВАНЫ В TJ - отправляем в чат бота, там бот покажет 30 видео
  document.getElementById('status').innerHTML=`Сервера заблокированы в TJ 😔<br>Отправляю "${q}" в чат бота - там покажу 30 видео (у бота нет блокировки)<br><br><button onclick="fallback()" style="background:#3ea6ff;color:#fff;border:none;border-radius:20px;padding:12px 20px;font-weight:bold">Показать 30 видео в чате бота</button>`;
  window.fallbackQuery = q;
}

function fallback(){
  const q = window.fallbackQuery;
  tg.sendData(q);
  tg.showAlert(`Отправил "${q}" боту! В чате появится 30 видео`);
  setTimeout(()=>tg.close(), 500);
}

function openPlayer(id, title, chan){
  curId=id; curTitle=title;
  document.getElementById('frm').src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&modestbranding=1`;
  document.getElementById('p-title').innerText=title;
  document.getElementById('p-chan').innerText=chan||id;
  document.getElementById('player').style.display='flex';
}
function closePlayer(){
  document.getElementById('player').style.display='none';
  document.getElementById('frm').src='';
}
function download(){
  if(!curId) return;
  tg.sendData(`https://www.youtube.com/watch?v=${curId}`);
  tg.showPopup({message:`Отправил "${curTitle.slice(0,30)}..." боту!`});
}
document.getElementById('q').addEventListener('keypress', e=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
