<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial, sans-serif; -webkit-tap-highlight-color: transparent;}
.top{position:sticky;top:0;background:#0f0f0f;padding:10px;display:flex;gap:8px;z-index:10;border-bottom:1px solid #222}
.top input{flex:1;background:#212121;border:none;border-radius:20px;padding:12px 16px;color:white;outline:none;font-size:15px}
.top button{background:#fff;color:#000;border:none;border-radius:50%;width:42px;height:42px;font-weight:bold;cursor:pointer;flex-shrink:0}
.v{display:flex;gap:10px;padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.v:active{background:#1a1a1a}
.v img{width:150px;height:85px;border-radius:8px;object-fit:cover;background:#222;flex-shrink:0;display:block}
.v .t{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .c{font-size:12px;color:#aaa;margin-top:4px}
#player{position:fixed;inset:0;background:#000;z-index:100;display:none;flex-direction:column;overflow-y:auto}
#player .frame-wrap{width:100%;background:#000;position:relative;aspect-ratio:16/9;}
#player iframe{width:100%;height:100%;border:none;background:#000;position:absolute;inset:0}
#player .p-info{padding:12px 12px 30px}
#player .p-title{font-size:16px;line-height:1.3}
#player .p-chan{font-size:13px;color:#aaa;margin-top:6px}
#player .btn{margin:10px 12px 0;background:#3ea6ff;color:white;border:none;border-radius:20px;padding:14px;font-weight:bold;width:calc(100% - 24px);cursor:pointer;display:block}
#player .close{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px;z-index:101;cursor:pointer}
#status{text-align:center;color:#888;padding:15px;font-size:13px;line-height:1.4;white-space:pre-line}
</style>
</head>
<body>
<div class="top">
<input id="q" type="text" placeholder="Напиши что искать, например: Марина" autocomplete="off" enterkeyhint="search">
<button onclick="search()">🔍</button>
</div>
<div id="status">Напиши название - покажу 30 видео, можно смотреть прямо тут</div>
<div id="list"></div>

<div id="player">
<button class="close" onclick="closePlayer()">✕</button>
<div class="frame-wrap"><iframe id="frm" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
<div class="p-info">
<div class="p-title" id="p-title"></div>
<div class="p-chan" id="p-chan"></div>
<button class="btn" onclick="download()">⬇ Скачать это видео в боте</button>
<button class="btn" onclick="closePlayer()" style="background:#222">◀ Назад к 30 видео</button>
<div id="player-status" style="text-align:center;color:#666;font-size:12px;margin-top:10px"></div>
</div>
</div>

<script>
const tg = window.Telegram.WebApp; 
try{ tg.expand(); tg.ready(); }catch(e){}

let curId=null, curTitle='', curBase=null;

const SERVERS = [
  'https://vid.puffyan.us',
  'https://yewtu.be',
  'https://invidious.flokinet.to',
  'https://inv.nadeko.net',
  'https://inv.tux.pizza',
  'https://iv.melmac.space'
];

async function tryServer(base, q){
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 6000);
  try{
    const res = await fetch(`${base}/api/v1/search?q=${encodeURIComponent(q)}`, {signal: controller.signal, headers: {'Accept':'application/json'}});
    clearTimeout(timeout);
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const videos = data.filter(v=>v.type==='video').slice(0,30);
    if(videos.length===0) throw new Error('empty');
    return {base, videos};
  }catch(e){
    clearTimeout(timeout);
    throw e;
  }
}

async function search(){
  const qEl = document.getElementById('q');
  const q = qEl.value.trim();
  if(!q){ try{tg.showAlert('Напиши что искать')}catch(e){alert('Напиши что искать')} return; }
  
  document.getElementById('status').innerText=`Ищу "${q}" ...`;
  document.getElementById('list').innerHTML='';
  
  // Параллельно пробуем все сервера, берем первый кто ответил
  const promises = SERVERS.map(b => tryServer(b, q).then(r=>r).catch(()=>null));
  let result = null;
  
  // Ждем любой успешный
  for(let p of promises){
    const r = await p;
    if(r){ result = r; break; }
  }
  // Если первый быстрый не успел, ждем все
  if(!result){
    const all = await Promise.all(promises);
    result = all.find(x=>x);
  }

  if(result){
    curBase = result.base;
    showList(result.videos);
    return;
  }

  document.getElementById('status').innerHTML=`Сервера Invidious не отвечают в TJ 😔\nПопробую отправить запрос в бот`;
  window.fallbackQuery = q;
  setTimeout(()=>fallback(), 800);
}

function showList(videos){
  document.getElementById('status').innerText=`Нашел ${videos.length} видео - нажми чтобы смотреть`;
  const list=document.getElementById('list');
  list.innerHTML='';
  videos.forEach((v,i)=>{
    let thumb = `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`;
    if(v.videoThumbnails && v.videoThumbnails.length){
      thumb = v.videoThumbnails[1]?.url || v.videoThumbnails[0].url || thumb;
      // делаем https
      if(thumb.startsWith('/')) thumb = curBase + thumb;
    }
    const div=document.createElement('div');
    div.className='v';
    div.innerHTML=`<img src="${thumb}" loading="lazy" onerror="this.src='https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg'"><div><div class="t">${i+1}. ${escapeHtml(v.title)}</div><div class="c">${escapeHtml(v.author)} • ${v.viewCountText||''}</div></div>`;
    div.onclick=()=>openPlayer(v.videoId, v.title, v.author);
    list.appendChild(div);
  });
  // Не открываем сразу первое - это бесило пользователей, пусть сами выберут
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function openPlayer(id, title, chan){
  curId=id; curTitle=title;
  document.getElementById('p-title').innerText=title;
  document.getElementById('p-chan').innerText=chan||id;
  document.getElementById('player-status').innerText='Загрузка плеера...';
  document.getElementById('player').style.display='flex';
  document.body.style.overflow='hidden';

  // 1. Пробуем YouTube
  const frm = document.getElementById('frm');
  frm.src=`https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&modestbranding=1&rel=0`;

  // 2. Если через 2.5 сек не загрузился (блокировка в TJ) - переключаем на Invidious embed
  setTimeout(()=>{
    if(!curBase) return;
    try{
      // Проверяем что iframe все еще пустой
      const isBlocked = frm.contentDocument == null; // косвенный признак
      if(document.getElementById('player-status').innerText.includes('Загрузка')){
        document.getElementById('player-status').innerText=`YouTube заблокирован, включаю через ${curBase}`;
        frm.src = `${curBase}/embed/${id}?autoplay=1`;
      }
    }catch(e){
      frm.src = `${curBase}/embed/${id}?autoplay=1`;
    }
  }, 2500);

  frm.onload = ()=>{ document.getElementById('player-status').innerText=''; };
}

function closePlayer(){
  document.getElementById('player').style.display='none';
  document.getElementById('frm').src='about:blank';
  document.body.style.overflow='';
}

function fallback(){
  const q = window.fallbackQuery || document.getElementById('q').value.trim();
  if(!q) return;
  try{
    tg.sendData(q);
    tg.showAlert(`Отправил "${q}" боту! В чате появится 30 видео`);
    setTimeout(()=>tg.close(), 500);
  }catch(e){
    document.getElementById('status').innerText='Не удалось отправить в бот. Открой этот WebApp через кнопку в боте.';
  }
}

function download(){
  if(!curId) return;
  try{
    tg.sendData(`https://www.youtube.com/watch?v=${curId}`);
    try{tg.showPopup({message:`Отправил "${curTitle.slice(0,40)}..." боту для скачивания!`});}catch(e){tg.showAlert('Отправлено боту!')}
  }catch(e){ alert('Открой через бота чтобы скачать'); }
}

document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
</script>
</body>
</html>
