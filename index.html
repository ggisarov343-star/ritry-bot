<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritri_YouTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px;margin:0}
.search-box{display:flex;gap:10px;margin-bottom:20px}
input{flex:1;background:#222;border:none;color:#fff;padding:15px;border-radius:25px;outline:none;font-size:16px}
button{background:#333;border:none;color:#fff;width:50px;height:50px;border-radius:50%;font-size:20px;cursor:pointer}
.result{background:#111;padding:15px;border-radius:10px;margin-bottom:10px;cursor:pointer}
.result:active{background:#222}
</style>
</head>
<body>
<div class="search-box">
<input id="q" type="text" placeholder="Ману бегир" />
<button onclick="doSearch()">🔍</button>
</div>
<div id="results">Напиши название песни</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

function doSearch(){
    const query = document.getElementById('q').value.trim();
    if(!query){ return; }
    document.getElementById('results').innerHTML = 'Ищу...';
    
    // Отправляем запрос боту
    tg.sendData(query);
    
    // Закрываем окно через секунду
    setTimeout(()=>{ tg.close(); }, 500);
}

// Поиск по Enter
document.getElementById('q').addEventListener('keypress', function(e){
    if(e.key === 'Enter'){ doSearch(); }
});
</script>
</body>
</html>
